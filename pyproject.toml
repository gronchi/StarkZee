[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "starkzee"
version = "0.1.0"
description = "Coupled Stark-Zeeman plasma line-shape model for hydrogen-like radiators"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "G. Ronchi" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev  = ["pytest>=7", "scipy>=1.8", "matplotlib>=3.5"]
docs = ["sphinx>=7.2", "furo>=2024.1"]

[project.scripts]
starkzee = "starkzee.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["starkzee*"]
