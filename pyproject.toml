[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "starkzee"
dynamic = ["version"]
description = "Coupled Stark-Zeeman plasma line-shape model for hydrogen-like radiators"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "G. Ronchi" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev  = ["pytest>=7", "scipy>=1.8", "matplotlib>=3.5"]
docs = ["sphinx>=7.2", "sphinx-rtd-theme>=2.0", "sphinxcontrib-mermaid>=2.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["starkzee*"]

[tool.setuptools_scm]
write_to = "starkzee/_version.py"
